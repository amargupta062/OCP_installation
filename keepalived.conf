
global_defs {
    router_id OCP_BASTION
}

vrrp_script chk_haproxy {
    script "/usr/bin/systemctl is-active --quiet haproxy"
    interval 2
    fall 2
    rise 2
    weight 0
}

vrrp_instance VI_OCP {
    state MASTER
    interface ens18
    virtual_router_id 51
    priority 110
    advert_int 1

    virtual_ipaddress {
        192.168.1.75/24 dev ens18
    }

    track_script {
        chk_haproxy
    }
}

