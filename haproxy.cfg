
#---------------------------------------------------------------------
# OpenShift Container Platform 4.22 - HAProxy Configuration
# HAProxy version: 2.4.x
# Cluster domain: ocp.amar.com
# HAProxy IP: 192.168.1.75
#---------------------------------------------------------------------

global
    log         127.0.0.1 local2
    chroot      /var/lib/haproxy
    pidfile     /var/run/haproxy.pid
    maxconn     4000
    user        haproxy
    group       haproxy
    daemon

    stats socket /var/lib/haproxy/stats

    ssl-default-bind-ciphers PROFILE=SYSTEM
    ssl-default-server-ciphers PROFILE=SYSTEM

#---------------------------------------------------------------------
# Default settings
#---------------------------------------------------------------------

defaults
    mode                    tcp
    log                     global
    option                  tcplog
    option                  dontlognull
    option                  redispatch
    retries                 3
    timeout connect         10s
    timeout client          1m
    timeout server          1m
    timeout check           10s
    maxconn                 3000

#---------------------------------------------------------------------
# OpenShift Kubernetes API - Port 6443
# api.ocp.amar.com
#---------------------------------------------------------------------

frontend ocp_api
    bind 192.168.1.75:6443
    default_backend ocp_api_backend

backend ocp_api_backend
    balance roundrobin
    option httpchk
    http-check connect ssl
    http-check send meth GET uri /readyz ver HTTP/1.1 hdr Host api.ocp.amar.com
    http-check expect status 200
    default-server inter 10s fall 2 rise 3
    server bootstrap 192.168.1.71:6443 check check-ssl verify none
    server master1 192.168.1.72:6443 check check-ssl verify none
    server master2 192.168.1.73:6443 check check-ssl verify none
    server master3 192.168.1.74:6443 check check-ssl verify none

#---------------------------------------------------------------------
# OpenShift Machine Config Server - Port 22623
#---------------------------------------------------------------------

frontend ocp_machine_config
    bind 192.168.1.75:22623
    default_backend ocp_machine_config_backend

backend ocp_machine_config_backend
    balance roundrobin
    default-server inter 10s fall 2 rise 3
    server bootstrap 192.168.1.71:22623 check
    server master1 192.168.1.72:22623 check
    server master2 192.168.1.73:22623 check
    server master3 192.168.1.74:22623 check

#---------------------------------------------------------------------
# OpenShift HTTP Ingress - Port 80
# *.apps.ocp.amar.com
#---------------------------------------------------------------------

frontend ocp_http
    bind 192.168.1.75:80
    default_backend ocp_http_backend

backend ocp_http_backend
    balance source
    default-server inter 10s fall 2 rise 3
    server master1 192.168.1.72:80 check
    server master2 192.168.1.73:80 check
    server master3 192.168.1.74:80 check

#---------------------------------------------------------------------
# OpenShift HTTPS Ingress - Port 443
# *.apps.ocp.amar.com
#---------------------------------------------------------------------

frontend ocp_https
    bind 192.168.1.75:443
    default_backend ocp_https_backend

backend ocp_https_backend
    balance source
    default-server inter 10s fall 2 rise 3
    server master1 192.168.1.72:443 check
    server master2 192.168.1.73:443 check
    server master3 192.168.1.74:443 check

